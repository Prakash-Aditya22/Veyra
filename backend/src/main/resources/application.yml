spring:
  application:
    name: blackspot-api
  datasource:
    # Absent at startup is fine — health and unit tests do not touch the DB.
    url: ${DATABASE_URL:}
  sql:
    init:
      mode: never

ors:
  api-key: ${ORS_API_KEY:}
  base-url: https://api.openrouteservice.org
  alternatives:
    # Measured live for Croydon -> Camden: at 0.6/1.6 alternatives overlap the
    # fastest route's geometry by ~46%, collapsing fastest-vs-safest into
    # near-identical cards. 0.2/2.0 drops overlap to 2-7%. Tunable here so a
    # demo can retune it for different endpoints without a rebuild.
    target-count: 3
    share-factor: 0.2
    weight-factor: 2.0

blackspot:
  corridor-metres: 50
  min-crashes: 6
  max-segments: 2000

server:
  # 8080 is taken by Oracle's TNS Listener on the development machine.
  port: 8081

logging:
  level:
    com.veyra.blackspot: INFO
